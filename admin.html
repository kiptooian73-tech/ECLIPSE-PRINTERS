<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin — RubberStamp Shop Orders</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .admin-login {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            max-width: 400px;
            margin: 2rem auto;
        }

        .admin-login input {
            margin-bottom: 1rem;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .orders-table th,
        .orders-table td {
            padding: 1rem;
            border-bottom: 1px solid #e6e9ef;
            text-align: left;
        }

        .orders-table th {
            background: #f7f7fb;
            font-weight: 600;
        }

        .order-id {
            font-weight: 600;
            color: var(--accent);
        }

        .status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <h1>ECLIPSE PRINTERS - Admin Dashboard</h1>
        <button id="logoutBtn" class="btn" style="margin-left: auto;">Logout</button>
    </header>

    <main id="main" role="main" class="admin-container">
        <div id="loginPanel" class="admin-login" style="display: none;">
            <h2>Admin Login</h2>
            <form id="loginForm">
                <label>Admin Token
                    <input id="tokenInput" type="password" required placeholder="Enter admin token">
                </label>
                <button class="btn" type="submit">Login</button>
            </form>
        </div>

        <div id="ordersPanel" style="display: none;">
            <h2>Orders</h2>
            <div id="ordersContainer">Loading orders...</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 RubberStamp Shop</p>
    </footer>

    <script>
        let adminToken = '';

        async function loadOrders() {
            try {
                const res = await fetch('/api/admin/orders', {
                    headers: { 'x-admin-token': adminToken }
                });
                if (res.status === 401) {
                    adminToken = '';
                    showLogin();
                    return;
                }
                if (!res.ok) throw new Error('Failed to load orders');
                const orders = await res.json();
                displayOrders(orders);
            } catch (e) {
                document.getElementById('ordersContainer').innerHTML = `<p>Error: ${e.message}</p>`;
            }
        }

        function displayOrders(orders) {
            if (orders.length === 0) {
                document.getElementById('ordersContainer').innerHTML = '<p>No orders yet.</p>';
                return;
            }
            const table = document.createElement('table');
            table.className = 'orders-table';
            table.innerHTML = `
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Total (KES)</th>
            <th>Items</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${orders.map(o => `
            <tr>
              <td class="order-id">${o.id}</td>
              <td>${o.name}</td>
              <td>${o.phone}</td>
              <td>${o.total}</td>
              <td>${o.items.map(it => `${it.qty}x ${it.name}`).join(', ')}</td>
              <td>${new Date(o.timestamp).toLocaleDateString()}</td>
              <td><span class="status-badge status-${o.status}">${o.status}</span></td>
            </tr>
          `).join('')}
        </tbody>
      `;
            document.getElementById('ordersContainer').innerHTML = '';
            document.getElementById('ordersContainer').appendChild(table);
        }

        function showLogin() {
            document.getElementById('loginPanel').style.display = 'block';
            document.getElementById('ordersPanel').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
        }

        function showOrders() {
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('ordersPanel').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            loadOrders();
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            adminToken = document.getElementById('tokenInput').value.trim();
            if (!adminToken) {
                alert('Please enter your admin token.');
                return;
            }
            showOrders();
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            adminToken = '';
            showLogin();
        });

        showLogin();
    </script>
</body>

</html>
